worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       C:/nginx-1.30.5/conf/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # =========================================================================
    # UPSTREAM LOAD BALANCER CLUSTER
    # Distributes traffic across multiple MediTrack Spring Boot backend nodes.
    # Algorithm: least_conn (routes new requests to the node with fewest active connections)
    # =========================================================================
    upstream meditrack_backend {
        least_conn;

        # Node 1 (Primary / Instance 1)
        server 127.0.0.1:8080 max_fails=3 fail_timeout=10s;

        # Node 2 (Secondary / Instance 2 - run with: --server.port=8081)
        server 127.0.0.1:8081 max_fails=3 fail_timeout=10s;

        # Keepalive persistent HTTP/1.1 connections for high throughput & low latency
        keepalive 32;
    }

    server {
        listen       80;
        server_name  localhost;

        # -----------------------------------------------------------------
        # 1. API Load Balancing -> Upstream Backend Cluster
        # -----------------------------------------------------------------
        location /api/ {
            proxy_pass http://meditrack_backend/api/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # High availability: automatic failover to the next healthy instance
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        # -----------------------------------------------------------------
        # 2. File Uploads Load Balancing (Prescriptions, receipts, images)
        # -----------------------------------------------------------------
        location /uploads/ {
            proxy_pass http://meditrack_backend/uploads/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # -----------------------------------------------------------------
        # 3. WebSockets (STOMP / SockJS Live Order & Delivery Tracking)
        # -----------------------------------------------------------------
        location /ws/ {
            proxy_pass http://meditrack_backend/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # -----------------------------------------------------------------
        # 4. Frontend: Proxies to Vite dev server (or fallback)
        # -----------------------------------------------------------------
        location / {
            proxy_pass http://127.0.0.1:5173;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
