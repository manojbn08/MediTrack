# Server configuration
server.port=8080
server.servlet.context-path=/

# Base Spring & JPA
spring.application.name=meditrack-backend
spring.jpa.open-in-view=false

# Default datasource: In-memory H2 with MySQL mode for instant local testing and fast boot
spring.datasource.url=jdbc:h2:mem:meditrack;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Security & JWT
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.access-exp-min=15
app.jwt.refresh-exp-days=7

# File upload settings
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.file.upload-dir=./uploads

# Pharmacy defaults (Bangalore coordinate center as per architecture doc)
app.pharmacy.name=MediTrack Central Pharmacy
app.pharmacy.lat=12.9716
app.pharmacy.lng=77.5946
app.delivery.radius-km=15.0
app.delivery.base-fee=40.0
app.delivery.free-threshold=500.0

# OpenAPI Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator
management.endpoints.web.exposure.include=health,info,metrics

# Email Notification Configuration (Eclipse Angus Mail + Mailpit / SMTP)
meditrack.mail.enabled=${MEDITRACK_MAIL_ENABLED:true}
meditrack.mail.from=${MEDITRACK_MAIL_FROM:noreply@meditrack.com}
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# RabbitMQ AMQP & STOMP Relay Configuration
meditrack.rabbitmq.enabled=${MEDITRACK_RABBITMQ_ENABLED:false}
meditrack.rabbitmq.host=${MEDITRACK_RABBITMQ_HOST:localhost}
meditrack.rabbitmq.port=${MEDITRACK_RABBITMQ_PORT:5672}
meditrack.rabbitmq.stomp-port=${MEDITRACK_RABBITMQ_STOMP_PORT:61613}
meditrack.rabbitmq.username=${MEDITRACK_RABBITMQ_USERNAME:guest}
meditrack.rabbitmq.password=${MEDITRACK_RABBITMQ_PASSWORD:guest}

spring.rabbitmq.host=${MEDITRACK_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${MEDITRACK_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${MEDITRACK_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${MEDITRACK_RABBITMQ_PASSWORD:guest}

# RabbitMQ Listener Retry and DLQ Policies
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=2000ms
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.default-requeue-rejected=false

