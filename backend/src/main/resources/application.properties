# Server configuration
server.port=8080
server.servlet.context-path=/

# Base Spring & JPA
spring.application.name=meditrack-backend
spring.jpa.open-in-view=false

# Default datasource: In-memory H2 with MySQL mode for instant local testing and fast boot
spring.datasource.url=jdbc:h2:mem:meditrack;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Security & JWT
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.access-exp-min=60
app.jwt.refresh-exp-days=7

# File upload settings
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.file.upload-dir=./uploads

# Pharmacy defaults (Bangalore coordinate center as per architecture doc)
app.pharmacy.name=MediTrack Central Pharmacy
app.pharmacy.lat=12.9716
app.pharmacy.lng=77.5946
app.delivery.radius-km=15.0
app.delivery.base-fee=40.0
app.delivery.free-threshold=500.0

# OpenAPI Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
